 {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rappiteca · Catalog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <header class="nav">
    <a href="#" class="nav-brand">Rappiteca</a>
    <nav class="nav-actions">
      <a href="{% url 'signup' %}" class="btn btn-ghost">Sign up</a>
      <a href="#" class="btn btn-solid">Log in</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">Online catalog</p>
    <h1 class="title">Rappiteca</h1>
    <hr class="rule">
    <p class="subtitle">
      Check book availability in real time. No account needed to browse the catalog.
    </p>

    <div class="search-card">
      <span class="search-label">Search the catalog</span>
      <form class="search-form">
        <input
          type="text"
          name="q"
          placeholder="Title, author, category, or ISBN…"
        >
        <button type="submit">Search</button>
      </form>
    </div>

    <!-- Featured / search results can go here -->
  </main>

</body>
</html>
